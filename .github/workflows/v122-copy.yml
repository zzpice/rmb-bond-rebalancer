d > summary", { hasText: "高级设置" }).click();\n    await expect(page.locator("label[for='landingPct']")).toHaveText("越界后回调比例（%）");\n    await expect(page.locator("label[for='minTradeYuan']")).toHaveText("小额交易阈值（CNY）");\n  });\n});\n''', encoding='utf-8')

