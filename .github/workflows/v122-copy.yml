name: Apply v1.2.2 Copy Refinements

on:
  push:
    branches:
      - feature/v1.2.2
    paths:
      - v122-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.2
      - name: Apply copy, naming and Morningstar link refinements
