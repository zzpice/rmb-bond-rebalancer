name: Apply v1.2.3 Maintenance Polish

on:
  push:
    branches: [feature/v1.2.3]
    paths: [.github/workflows/v123-maintenance.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply maintenance changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          VERSION = '1.2.3'
          LIVE_URL = 'https://zzpice.github.io/rmb-bond-rebalancer/'

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Release markers.
          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['version'] = VERSION
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version'] = VERSION
          lock['packages']['']['version'] = VERSION
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace('service-worker.js', '`${CACHE_PREFIX}v1.2.2`', '`${CACHE_PREFIX}v1.2.3`')
          replace('tests/version-consistency.spec.js', 'const releaseVersion = "1.2.2";', 'const releaseVersion = "1.2.3";')
          replace('tests/ui-v120.spec.js', 'toContainText("v1.2.2")', 'toContainText("v1.2.3")')

          # Head metadata and accessibility semantics, no visual redesign.
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          head_anchor = '<meta name="format-detection" content="telephone=no">\n'
          head_meta = (
              '<meta name="format-detection" content="telephone=no">\n'
              '<meta name="description" content="轻量级人民币债券基金再平衡工具，根据当前持仓、资金变动、目标比例和免调范围生成尽量减少换手的调整建议。">\n'
              '<meta property="og:title" content="债基再平衡助手 · CNY">\n'
              '<meta property="og:description" content="根据当前持仓、资金变动、目标比例和免调范围，生成尽量减少换手的债券基金调整建议。">\n'
              '<meta property="og:type" content="website">\n'
              f'<meta property="og:url" content="{LIVE_URL}">\n'
              f'<link rel="canonical" href="{LIVE_URL}">\n'
          )
          if head_anchor not in text:
              raise SystemExit('head metadata anchor not found')
          text = text.replace(head_anchor, head_meta, 1)
          text = text.replace('© 2026 Zhipeng Zhou · v1.2.2', '© 2026 Zhipeng Zhou · v1.2.3', 1)
          text = text.replace(
              '<button id="force">按目标比例调整</button><div class="force-hint">忽略免调范围，直接回到目标附近</div>',
              '<button id="force" aria-describedby="forceHint">按目标比例调整</button><div class="force-hint" id="forceHint">忽略免调范围，直接回到目标附近</div>',
              1,
          )
          text = text.replace(
              '<div class="install-guide" id="installGuide" role="note" hidden>',
              '<div class="install-guide" id="installGuide" role="status" aria-live="polite" hidden>',
              1,
          )
          old_link = 'const fundLink=f=>`<a class="fund-link" href="${f.url}" target="_blank" rel="noopener noreferrer" title="${f.name}">${f.displayName}<span class="external" aria-hidden="true">↗</span></a>`;'
          new_link = 'const fundLink=f=>`<a class="fund-link" href="${f.url}" target="_blank" rel="noopener noreferrer" title="${f.name}" aria-label="${f.displayName}（晨星详情，新窗口打开）">${f.displayName}<span class="external" aria-hidden="true">↗</span></a>`;'
          if old_link not in text:
              raise SystemExit('fundLink anchor not found')
          text = text.replace(old_link, new_link, 1)
          index.write_text(text, encoding='utf-8')

          # README: current version + direct online entry.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          intro = '一个面向人民币债券基金组合的轻量级再平衡计算工具。\n\n'
          if intro not in text:
              raise SystemExit('README intro anchor not found')
          text = text.replace(intro, intro + f'[在线使用]({LIVE_URL})\n\n', 1)
          old_section = '''## 当前版本：v1.2.2\n\nv1.2.2 优化页面文案、基金显示名称与代码呈现，并将基金详情链接统一切换到晨星；不改变产品行为、核心再平衡算法或无状态设计。\n\n### v1.2.2 文案与命名优化\n'''
          new_section = '''## 当前版本：v1.2.3\n\nv1.2.3 补齐正式分支回归、项目在线入口、网页分享元数据与少量无障碍语义；不改变产品行为、核心再平衡算法或无状态设计。\n\n### v1.2.3 维护与细节优化\n\n- `main` 分支更新后也运行完整回归测试，补齐正式分支最终验证\n- README 增加在线使用入口\n- 补充页面 description、Open Graph 与 canonical 元数据\n- 为次级调整操作、晨星外链与安装提示补充更明确的辅助技术语义\n\n### v1.2.2 文案与命名优化\n'''
          if old_section not in text:
              raise SystemExit('README version section anchor not found')
          text = text.replace(old_section, new_section, 1)
          readme.write_text(text, encoding='utf-8')

          # Focused v1.2.3 regression coverage.
          Path('tests/ui-v123.spec.js').write_text('''import { test, expect } from "@playwright/test";\n\ntest.describe("v1.2.3 maintenance polish", () => {\n  test("页面包含基础分享与规范链接元数据", async ({ page }) => {\n    await page.goto("/");\n    await expect(page.locator('meta[name="description"]')).toHaveAttribute("content", /人民币债券基金再平衡/);\n    await expect(page.locator('meta[property="og:title"]')).toHaveAttribute("content", "债基再平衡助手 · CNY");\n    await expect(page.locator('meta[property="og:description"]')).toHaveAttribute("content", /尽量减少换手/);\n    await expect(page.locator('meta[property="og:type"]')).toHaveAttribute("content", "website");\n    await expect(page.locator('meta[property="og:url"]')).toHaveAttribute("content", "https://zzpice.github.io/rmb-bond-rebalancer/");\n    await expect(page.locator('link[rel="canonical"]')).toHaveAttribute("href", "https://zzpice.github.io/rmb-bond-rebalancer/");\n  });\n\n  test("次级调整操作与安装提示提供明确的无障碍语义", async ({ page }) => {\n    await page.goto("/");\n    await expect(page.locator("#force")).toHaveAttribute("aria-describedby", "forceHint");\n    await expect(page.locator("#forceHint")).toHaveText("忽略免调范围，直接回到目标附近");\n    await expect(page.locator("#installGuide")).toHaveAttribute("role", "status");\n    await expect(page.locator("#installGuide")).toHaveAttribute("aria-live", "polite");\n  });\n\n  test("晨星基金外链向辅助技术说明新窗口行为", async ({ page }) => {\n    await page.goto("/");\n    const links = page.locator("#fundBody .fund-link");\n    await expect(links).toHaveCount(4);\n    for (let i = 0; i < 4; i++) {\n      await expect(links.nth(i)).toHaveAttribute("target", "_blank");\n      await expect(links.nth(i)).toHaveAttribute("aria-label", /晨星详情，新窗口打开/);\n    }\n  });\n});\n''', encoding='utf-8')
          PY

      - name: Commit maintenance changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html package.json package-lock.json service-worker.js tests/version-consistency.spec.js tests/ui-v120.spec.js tests/ui-v123.spec.js
          git commit -m "chore: polish v1.2.3 maintenance details"
          git push origin HEAD:feature/v1.2.3
