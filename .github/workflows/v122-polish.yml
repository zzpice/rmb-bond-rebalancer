name: Final v1.2.2 Wording Polish

on:
  push:
    branches:
      - feature/v1.2.2
    paths:
      - v122-polish-trigger.txt

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.2
      - name: Polish remaining user-facing wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ('触发阈值、取整单位与最低交易额，一般无需修改','触发阈值、取整单位与小额交易阈值，一般无需修改'),
            ('只拉回安全区，不强求精确归位，减少重复交易。','只回调到安全区，不强求精确归位，减少重复交易。'),
            ('越界后拉回比例须为允许偏差的 10%～90%。','越界后回调比例须为允许偏差的 10%～90%。'),
            ('headline="无需买卖，外部资金与内部转换均为零。"','headline="无需买卖，资金变动与基金间转换均为零。"'),
            ('"无外部资金变动"','"无资金变动"'),
            ('`内部转换 ${money(plan.internalTurnover)}`','`基金间转换 ${money(plan.internalTurnover)}`'),
            ('"无内部转换"','"无基金间转换"'),
            ('资金分配与内部转换相抵，最终无需操作。','资金分配与基金间转换相抵，最终无需操作。'),
            ('资金处理后位于免调整范围内，无需操作。','资金分配后位于免调范围内，无需操作。'),
            ('当前位于免调整范围内，无需操作。','当前位于免调范围内，无需操作。'),
            ('资金处理后仍越界，参与内部转换','资金分配后仍越界，参与基金间转换'),
            ('为配平越界基金，参与内部转换','为配平越界基金，参与基金间转换'),
            ('包含资金变动和基金之间转换后的最终操作。','包含资金变动和基金间转换后的最终操作。'),
            ('低于最低交易额的必要交易会保留，以处理尾差或防止越界。','低于小额交易阈值的必要交易会保留，以处理尾差或防止越界。'),
            ('比例对比（调整前 / 目标 / 调整后）','调整前后（调整前 / 目标 / 调整后）')
          ]
          for a,b in pairs:s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          Path('v122-polish-trigger.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: polish remaining v1.2.2 wording"
          git push origin HEAD:feature/v1.2.2
