name: Apply adjustment reason fix

on:
  push:
    branches:
      - fix/v1.1.0-adjustment-reason

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1.0-adjustment-reason
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply scoped explanation fix and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '''  if(!trade){
    if(flowPart||internalPart)return"资金分配与内部转换相抵，最终无需操作。";
    if(plan.rawTotalTrades[i])return"建议金额经取整与小额合并后无需下单。";
'''
          new = '''  if(!trade){
    if(plan.rawTotalTrades[i])return"建议金额经取整与小额合并后无需下单。";
    if(flowPart||internalPart)return"资金分配与内部转换相抵，最终无需操作。";
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one adjustmentReason block, found {text.count(old)}')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')

          spec = Path('tests/experience-v110.spec.js')
          test_text = spec.read_text(encoding='utf-8')
          marker = 'test("取整合并归零时说明真实原因而不是内部转换相抵"'
          if marker not in test_text:
              test_text += r'''

test("取整合并归零时说明真实原因而不是内部转换相抵", async ({ page }) => {
  await page.goto("/");
  await fillPortfolio(page, { holdings: AT_TARGET, flow: 3.33 });
  await generate(page);

  const row = page.locator("#resultBody tr").nth(3);
  await expect(row.locator(".trade-cell")).toHaveText("不操作");
  await expect(row.locator(".reason-cell")).toHaveText("建议金额经取整与小额合并后无需下单。");
  await expect(row.locator(".reason-cell")).not.toContainText("内部转换相抵");
});
'''
              spec.write_text(test_text, encoding='utf-8')
          PY
      - name: Commit scoped fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-adjustment-reason-fix.yml
          git add index.html tests/experience-v110.spec.js
          git commit -m "fix: clarify rounded no-op reason"
          git push origin HEAD:fix/v1.1.0-adjustment-reason
